@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap');
:root{
  --primary:#7c3aed; --bg:#0f0f1a; --card:#1a1a2e; --button:#7c3aed;
  --text:#ffffff; --muted:#a1a1aa; --border:#2a2a40; --input:#0f0f1a;
}
[data-theme="light"]{
  --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --muted:#64748b;
  --border:#e2e8f0; --input:#f1f5f9;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif;transition:background .2s,color .2s,border-color .2s}
body{background:var(--bg);color:var(--text);min-height:100vh}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 90%, transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:26px;letter-spacing:1px;background:linear-gradient(135deg,var(--primary),#ec4899,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;text-transform:uppercase}
nav{display:flex;gap:14px;align-items:center}
nav a{font-weight:600;opacity:.9}
.btn{background:var(--button);color:white;border:none;padding:10px 18px;border-radius:10px;font-weight:700;cursor:pointer}
.btn-outline{background:transparent;border:1px solid var(--primary);color:var(--text);padding:9px 16px;border-radius:10px;cursor:pointer}
.icon-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:10px;cursor:pointer}
.container{max-width:1150px;margin:0 auto;padding:20px}
.announce{background:linear-gradient(90deg,var(--primary),#ec4899);color:white;text-align:center;padding:8px;font-weight:600;font-size:14px}
.hero{text-align:center;padding:50px 20px}
.hero h1{font-size:52px;font-weight:900;margin:10px 0;background:linear-gradient(135deg,var(--primary),#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);font-size:18px;margin-bottom:20px}
.search-bar{max-width:550px;margin:20px auto;display:flex;gap:10px}
.search-bar input{flex:1;padding:13px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text)}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center}
.stat h3{font-size:24px}
.stat p{color:var(--muted);font-size:13px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0;justify-content:center}
.filters select,.filters input{padding:10px;border-radius:10px;background:var(--card);color:var(--text);border:1px solid var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(305px,1fr));gap:20px;margin-top:20px}
.card{background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--border);position:relative;padding:16px;display:flex;flex-direction:column}
.card.featured{border:2px solid var(--primary)}
.free-badge{position:absolute;top:12px;right:12px;background:#10b981;color:white;font-size:11px;font-weight:800;padding:5px 10px;border-radius:20px;z-index:2}
.feat-badge{position:absolute;top:12px;left:12px;background:var(--primary);color:white;font-size:11px;font-weight:800;padding:5px 10px;border-radius:20px;z-index:2}
.card h3{font-size:19px;margin:8px 0 8px;cursor:pointer}
.card h3:hover{color:var(--primary)}
.card img{width:100%;height:180px;object-fit:cover;border-radius:12px;margin-bottom:10px;cursor:pointer}
.card p{color:var(--muted);font-size:14px;margin-bottom:10px;flex:0}
.prompt-box{background:var(--input);border:1px dashed var(--border);padding:12px;border-radius:10px;font-size:13px;white-space:pre-wrap;max-height:110px;overflow:auto;margin-bottom:12px}
.card-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap;gap:6px}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.card-actions button{flex:1;padding:9px;border-radius:9px;border:none;cursor:pointer;font-weight:700;font-size:13px;min-width:70px}
.copy-btn{background:var(--button);color:white}
.save-btn{background:var(--border);color:var(--text)}
.like-btn{background:transparent;border:1px solid var(--border)!important;color:var(--text)}
.share-btn{background:transparent;border:1px solid var(--primary)!important;color:var(--text)}
.page{display:none}.page.active{display:block}
.form-box{max-width:440px;margin:30px auto;background:var(--card);padding:28px;border-radius:18px;border:1px solid var(--border)}
.form-box h2,.form-box h3{margin-bottom:16px;text-align:center}
.form-box input,.form-box textarea,.form-box select{width:100%;padding:12px;margin-bottom:12px;border-radius:10px;border:1px solid var(--border);background:var(--input);color:var(--text)}
.form-box label{font-size:13px;color:var(--muted);margin:6px 0 4px;display:block}
.whatsapp-btn{display:inline-block;background:#25D366;color:white;padding:14px 24px;border-radius:12px;font-weight:800;margin:10px 0}
footer{margin-top:60px;border-top:1px solid var(--border);padding:30px 20px;text-align:center;color:var(--muted)}
#adminModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;justify-content:center;align-items:center}
#promptModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;justify-content:center;align-items:center;padding:20px}
.modal-card{background:var(--card);border-radius:18px;max-width:600px;width:100%;max-height:90vh;overflow:auto;padding:20px;border:1px solid var(--border)}
.admin-tabs{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}
.admin-tabs button{padding:10px 14px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:13px}
.admin-tabs button.active{background:var(--primary);color:white}
table{width:100%;border-collapse:collapse;margin-top:12px}
table th,table td{padding:10px;border:1px solid var(--border);text-align:left;font-size:13px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:30px;font-weight:700;display:none;z-index:300}
.live-indicator{font-size:12px;padding:6px 10px;border-radius:20px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;gap:6px}
